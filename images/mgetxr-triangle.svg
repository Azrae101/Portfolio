<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="40" y="52" font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#2b59c3" letter-spacing="1.5">TRIANGLE COMPLETION · SEATED VR · n = 4</text>

  <!-- task schematic -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 420 L170 170 L380 250" stroke="#131a2b" stroke-width="3"/>
    <path d="M380 250 L150 395" stroke="#2b59c3" stroke-width="3" stroke-dasharray="2 9"/>
    <path d="M380 250 L215 440" stroke="#828ba1" stroke-width="3" stroke-dasharray="2 9"/>
  </g>
  <g fill="#e8eefb" stroke="#131a2b" stroke-width="2.5">
    <rect x="160" y="140" width="20" height="30" rx="3"/>
    <rect x="370" y="220" width="20" height="30" rx="3"/>
  </g>
  <path d="M90 404 l5 11 12 1.3 -9 8 2.5 11.7 -10.5-6 -10.5 6 2.5-11.7 -9-8 12-1.3z" fill="#2b59c3"/>
  <circle cx="150" cy="395" r="8" fill="#2b59c3"/>
  <circle cx="215" cy="440" r="8" fill="#ffffff" stroke="#828ba1" stroke-width="3"/>
  <g font-size="15" fill="#4d566c">
    <text x="62" y="470">start</text>
    <text x="190" y="135">waypoint 1</text>
    <text x="400" y="240">waypoint 2</text>
    <text x="232" y="455" fill="#828ba1">joystick stop</text>
    <text x="136" y="400" text-anchor="end" fill="#2b59c3">arm swing stop</text>
  </g>

  <!-- mean homing error -->
  <text x="490" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#828ba1" letter-spacing="1.2">MEAN HOMING ERROR</text>
  <g font-size="16">
    <text x="490" y="200" fill="#131a2b" font-weight="600">Joystick</text>
    <rect x="490" y="212" width="260" height="22" rx="4" fill="#eef1f7"/>
    <rect x="490" y="212" width="257" height="22" rx="4" fill="#828ba1"/>
    <text x="750" y="200" text-anchor="end" fill="#4d566c">9.9 m</text>

    <text x="490" y="282" fill="#131a2b" font-weight="600">Arm swing</text>
    <rect x="490" y="294" width="260" height="22" rx="4" fill="#eef1f7"/>
    <rect x="490" y="294" width="203" height="22" rx="4" fill="#2b59c3"/>
    <text x="750" y="282" text-anchor="end" fill="#4d566c">7.8 m</text>
  </g>
  <text x="490" y="360" font-size="14" fill="#4d566c">Lower for all four participants</text>
  <text x="490" y="382" font-size="14" fill="#4d566c">with arm-swing walking-in-place.</text>
</svg>
